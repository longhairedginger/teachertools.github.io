<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom widgets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --bg: #12263f;
    --panel: #1b3556;
    --ink: #f4f1e8;
    --muted: #a9bad0;
    --accent: #ffc857;
    --line: #35557d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); margin: 0 0 6px; }
  .intro { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .grid a {
    display: block;
    height: 100%;
    padding: 20px;
    background: var(--panel);
    border: 2px solid var(--line);
    border-top: 6px solid var(--accent);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
  }
  .grid a:hover { border-color: var(--accent); }
  .grid a:focus-visible { outline: 3px solid #6fd6c8; outline-offset: 3px; }
  .grid h2 { font-size: 1.3rem; margin: 0 0 6px; }
  .grid p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Classroom widgets</h1>
  <p class="intro">Pick a widget, then copy its page address into the web widget on Classroomscreen.</p>

  <ul class="grid">
    <li>
      <a href="exam_timer.html">
        <h2>Exam pacing timer</h2>
        <p>Counts up and shows how many marks a pupil should have reached, with and without 25% extra time.</p>
      </a>
    </li>

    <!-- To add a widget, copy the whole <li>…</li> block above, paste it here,
         then change the href, the title and the description. -->
  </ul>
</main>
</body>
</html>
