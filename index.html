
<!-- Example index page generated by AI. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Random Picker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .widget {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 85%;
      max-width: 400px;
      box-shadow: 0 5px 20px #0002;
    }

    h1 { color: #344b85; }

    #name {
      font-size: 30px;
      font-weight: bold;
      color: #536fbd;
      margin: 30px 0;
    }

    button {
      background: #536fbd;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover { background: #344b85; }
  </style>
</head>
<body>
  <div class="widget">
    <h1>Who's next?</h1>
    <div id="name">Ready?</div>
    <button onclick="pickName()">Pick someone!</button>
  </div>

  <script>
    const pupils = [
      "Alex",
      "Charlie",
      "Sam",
      "Jamie",
      "Taylor",
      "Morgan"
    ];

    function pickName() {
      const random = Math.floor(
        Math.random() * pupils.length
      );

      document.getElementById("name").textContent =
        pupils[random];
    }
  </script>
</body>
</html>
